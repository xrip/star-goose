name: switch

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switch
  cancel-in-progress: false

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Raylib-nx 5.5
        uses: actions/checkout@v4
        with:
          repository: luizpestana/raylib-nx
          ref: 5.5
          path: build/raylib-nx

      - name: Build raylib
        run: make -C build/raylib-nx/src PLATFORM=PLATFORM_NX CUSTOM_CFLAGS=-DNX_DISABLE_GAMEPAD_EMULATION -j"$(nproc)"

      - name: Stage RomFS
        run: |
          mkdir -p switch/romfs
          cp -a assets switch/romfs/assets

      - name: Build nro
        working-directory: switch
        run: RAYLIB_NX="$GITHUB_WORKSPACE/build/raylib-nx" make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: star-goose-nro
          path: switch/star-goose.nro
          if-no-files-found: error

  release:
    needs: nro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: star-goose-nro

      - name: Publish the Atmosphere release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Homebrew for Atmosphere. Copy `star-goose.nro` to `sdmc:/switch/` and start it from hbmenu.

          Stick or D-pad moves. A or ZR fires. L, ZL, or Y is the left weapon. R or X is the right weapon. Minus quits. Plus returns to the title.

          Scores are stored at `sdmc:/switch/star-goose/hiscores`.
          EOF
          )
          gh release delete switch --yes --cleanup-tag || true
          gh release create switch star-goose.nro --target "$GITHUB_SHA" --title "Star Goose for Atmosphere" --notes "$notes"
