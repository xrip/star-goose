  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    canvas.emscripten {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      outline: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #install, #ios-install {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 2;
      margin: 0;
      padding: 6px 10px;
      border: 2px solid #fff;
      background: #000;
      color: #fff;
      font: 14px/1 sans-serif;
    }
    #install { cursor: pointer; z-index: 4; }
    #ios-install { max-width: 16em; z-index: 4; }
    #touch, #rotate { display: none; }
    #rotate { width: 100%; height: 100%; margin: 0; border: 0; background: #000; color: #fff;
              font: 18px/1.4 sans-serif; }
    body.touch #touch { display: block; }
    #touch { position: fixed; inset: 0; z-index: 3; pointer-events: none; user-select: none;
             -webkit-user-select: none; -webkit-touch-callout: none; }
    #touch button { pointer-events: auto; position: absolute; display: grid; place-items: center;
                    width: 56px; height: 56px; padding: 0; border-radius: 50%;
                    border: 2px solid rgba(85, 255, 255, 0.45); background: rgba(0, 0, 0, 0.45);
                    color: #55ffff; opacity: 0.85; -webkit-tap-highlight-color: transparent;
                    touch-action: none; transition: transform 80ms, background 80ms; }
    #touch svg { width: 55%; height: 55%; fill: none; stroke: currentColor; stroke-width: 2;
                 stroke-linecap: round; stroke-linejoin: round; }
    #touch button.down { transform: scale(0.88); background: rgba(85, 255, 255, 0.4); color: #000; opacity: 1; }
    #touch-actions { position: absolute; width: 200px; height: 200px;
                     right: calc(8px + env(safe-area-inset-right));
                     bottom: calc(8px + env(safe-area-inset-bottom)); }
    #touch-actions .fire { width: 84px; height: 84px; left: 102px; top: 102px; }
    #touch-actions .left { left: 16px; top: 116px; }
    #touch-actions .right { left: 64px; top: 40px; }
    #touch-stick { pointer-events: auto; position: absolute; left: 0; bottom: 0;
                   width: calc(240px + env(safe-area-inset-left)); height: 240px; }
    .stick-base { position: absolute; left: calc(100px + env(safe-area-inset-left)); top: 140px;
                  width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
                  border: 2px solid rgba(85, 255, 255, 0.35); background: rgba(0, 0, 0, 0.35);
                  opacity: 0.45; transition: opacity 120ms; }
    .stick-base.active { opacity: 1; }
    .stick-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
                  margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(85, 255, 255, 0.55); }
    @media (orientation: portrait) and ((pointer: coarse) or (hover: none)) {
      #rotate { display: flex; position: fixed; inset: 0; z-index: 6; align-items: center;
                justify-content: center; padding: 2rem; background: #000; color: #fff;
                font: 18px/1.4 sans-serif; text-align: center; }
      #touch { display: none !important; }
    }
  </style>
</head>
<body>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <button id="install" type="button" hidden>Установить</button>
  <p id="ios-install" hidden>В Safari: Поделиться, затем «На экран Домой».</p>
  <button id="rotate" type="button">Нажмите, чтобы играть горизонтально</button>
  <script src="touch_controls.js"></script>
  <script>
    var installEvent = null;
    var installButton = document.getElementById("install");
    var iosHint = document.getElementById("ios-install");

    function installed() {
      return window.matchMedia("(display-mode: fullscreen)").matches
        || window.matchMedia("(display-mode: standalone)").matches
        || navigator.standalone === true;
    }

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      if (installed()) return;
      installEvent = event;
      installButton.hidden = false;
    });

    installButton.addEventListener("click", function () {
      if (!installEvent) return;
      installEvent.prompt();
      installEvent.userChoice.then(function () {
        installEvent = null;
        installButton.hidden = true;
      });
    });

    window.addEventListener("appinstalled", function () {
      installButton.hidden = true;
      iosHint.hidden = true;
    });

    if (!installed() && /iphone|ipad|ipod/i.test(navigator.userAgent)) iosHint.hidden = false;

    var rotate = document.getElementById("rotate");
    if (!gooseTouch.canLock) rotate.textContent = "Поверните устройство горизонтально";
    rotate.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        gooseTouch.lock();
    });
    gooseTouch.lock();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js");
      });
    }

    function kickResize() {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          window.dispatchEvent(new Event("resize"));
        });
      });
    }
    window.addEventListener("orientationchange", kickResize);
    document.addEventListener("fullscreenchange", kickResize);
    if (screen.orientation) screen.orientation.addEventListener("change", kickResize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", kickResize);

    var Module = {
      canvas: document.getElementById("canvas"),
      touchMask: 0,
      preRun: [function () {
        Module.addRunDependency("landscape");
        gooseTouch.landscape().then(function () {
          Module.removeRunDependency("landscape");
        });
      }]
    };
  </script>
